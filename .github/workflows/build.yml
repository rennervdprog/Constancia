name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS (framework)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compila o framework Kotlin/Native para iOS (simulador ARM64).
      # Sem assinatura — apenas valida que o código compartilhado compila para iOS.
      # A assinatura/distribuição via Xcode exige a conta Apple Developer.
      - name: Compile iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework-simulator
          path: shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework

  test:
    name: Unit tests (lógica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Roda os testes de commonTest (streaks, relatórios, datas) na JVM
      # via unit tests do Android.
      - name: Run unit tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

  ui-tests:
    name: UI tests (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testes de UI instrumentados num emulador Android de verdade:
      # tocam nos fluxos (criar hábito, check-in, tarefa, diário, stepper,
      # paywall) e tiram screenshots. O adb pull roda DENTRO deste step
      # porque o emulador é desligado quando ele termina.
      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace || echo FAILED > /tmp/uitest_failed
            mkdir -p uitest-screenshots
            adb root || true
            adb pull /data/data/app.constancia/files/uitests ./uitest-screenshots || true
            ls -la ./uitest-screenshots || true
            if [ -f /tmp/uitest_failed ]; then exit 1; fi

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: uitest-screenshots/
          if-no-files-found: warn
